[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "pyarrow", "duckdb", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
